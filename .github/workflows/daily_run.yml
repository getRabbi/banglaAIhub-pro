name: BanglaAIHub — Content Automation

on:
  schedule:
    # Daily at 09:15 Bangladesh time (03:15 UTC).
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "Number of posts to publish in this run"
        required: false
        default: "1"

concurrency:
  group: banglaaihub-content-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: automation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: automation/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check required secrets
        id: preflight
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=()
          [ -z "${SUPABASE_URL:-$NEXT_PUBLIC_SUPABASE_URL}" ] && missing+=("SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL")
          [ -z "$SUPABASE_SERVICE_KEY" ] && missing+=("SUPABASE_SERVICE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "run_pipeline=true" >> "$GITHUB_OUTPUT"

      - name: Run content automation with retries
        if: steps.preflight.outputs.run_pipeline == 'true'
        shell: bash
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "BanglaAIHubAutomation/1.0"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PH_API_TOKEN: ${{ secrets.PH_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOPICS: ${{ vars.GITHUB_TOPICS }}
          GITHUB_MIN_STARS: ${{ vars.GITHUB_MIN_STARS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          REWRITE_PROVIDER: ${{ vars.REWRITE_PROVIDER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_LINK_STRATEGY: ${{ vars.FB_LINK_STRATEGY || 'soft' }}
          FB_DIRECT_LINK_EVERY: ${{ vars.FB_DIRECT_LINK_EVERY || '4' }}
          FB_POST_FIRST_COMMENT: ${{ vars.FB_POST_FIRST_COMMENT || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          CONTENT_IMAGE_PROVIDER: ${{ vars.CONTENT_IMAGE_PROVIDER }}
          BLOG_BASE_URL: ${{ secrets.BLOG_BASE_URL }}
          POSTS_PER_RUN: ${{ inputs.posts_per_run || vars.POSTS_PER_RUN || '1' }}
          AUTOMATION_NAME: "BanglaAIHub Automation"
        run: |
          status=1
          for attempt in 1 2 3; do
            echo "Automation attempt ${attempt}/3"
            if python orchestrator.py; then
              status=0
              break
            fi
            echo "Attempt ${attempt} failed. Retrying after backoff..."
            sleep $((attempt * 60))
          done
          exit "$status"
